<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Room — a quiet white room for new paintings</title>
<meta name="description" content="A quiet white room for new paintings. Walk in, take your time, look closer.">
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}

:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --io:cubic-bezier(.65,0,.35,1);
  --ink:#111;
  --grey:#8b8883;
  --wall:#FBFBFA;
  --floor:#E4E0D8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall)}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ---------- 3D stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden;perspective:1300px;perspective-origin:50% 50%;background:#EEECE7;pointer-events:none}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.grp{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0}
.pl{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 46%,rgba(40,34,24,0) 58%,rgba(40,34,24,.075) 100%)}

/* headline painted on the two wall halves */
.wall-text{overflow:hidden}
.wall-text-in{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center}
.wall-head{margin:0;font-weight:600;letter-spacing:-.045em;line-height:.93;text-align:center;text-transform:uppercase;white-space:nowrap}
.wall-head span{display:block;color:#c8c7c4;transition:color 1.9s var(--ease) .35s}
.wall-head span+span{transition-delay:.5s}
.is-loaded .wall-head span{color:#121212}
.reduce .wall-head span{transition:none}

/* artworks */
.work .frame{position:absolute;inset:0;border-style:solid;border-color:#1d1c1a;overflow:hidden}
.work .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.work .frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 0 26px rgba(0,0,0,.18);
  background:linear-gradient(128deg,rgba(255,255,255,.08),rgba(255,255,255,0) 42%)}
.work .frame::before{content:"";position:absolute;inset:-10px;border:1px solid rgba(255,255,255,.07);pointer-events:none;z-index:1}
.wire{position:absolute;bottom:100%;width:1.6px;margin-left:-.8px;background:linear-gradient(to top,rgba(38,36,32,.55),rgba(38,36,32,.2))}
.wire::after{content:"";position:absolute;bottom:-3px;left:-2.6px;width:6.8px;height:12px;border-radius:2px;background:#56534e}
.label{position:absolute;bottom:4%;width:104px;padding:10px 11px 11px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.18);font-size:7.5px;line-height:1.4;color:#77746e;letter-spacing:.01em}
.label b{display:block;font-weight:600;color:#222;font-size:9px;letter-spacing:-.01em;margin-bottom:2px}
.wshadow i{position:absolute;inset:55px;box-shadow:0 15px 23px -9px rgba(28,22,14,.36),0 4px 8px -3px rgba(28,22,14,.2)}

/* ---------- nav card ---------- */
.nav{position:fixed;top:16px;left:50%;z-index:30;width:min(400px,calc(100vw - 24px));
  background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.05),0 10px 30px -12px rgba(0,0,0,.18);
  transform:translate(-50%,-14px);opacity:0;transition:transform 1s var(--ease) .15s,opacity .8s var(--ease) .15s}
.is-loaded .nav{transform:translate(-50%,0);opacity:1}
.nav-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px}
.logo{font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:8px;height:8px;border-radius:50%;background:#111;display:block;transition:transform .5s var(--ease)}
.logo:hover i{transform:scale(1.35)}
.burger{width:34px;height:34px;border:0;background:none;position:relative;border-radius:8px;transition:background .3s}
.burger:hover{background:#f3f2ef}
.burger span{position:absolute;left:10px;right:10px;height:1.5px;background:#111;border-radius:2px;transition:transform .55s var(--ease)}
.burger span:nth-child(1){top:13.5px}
.burger span:nth-child(2){top:19px}
.menu-open .burger span:nth-child(1){transform:translateY(2.75px) rotate(45deg)}
.menu-open .burger span:nth-child(2){transform:translateY(-2.75px) rotate(-45deg)}
.menu{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.menu-open .menu{grid-template-rows:1fr}
.menu-in{overflow:hidden}
.menu ol{list-style:none;margin:0;padding:4px 8px 6px;border-top:1px solid #f0efec}
.menu li button{width:100%;display:flex;align-items:baseline;gap:12px;border:0;background:none;padding:9px 8px;border-radius:8px;text-align:left;font-size:13px;font-weight:500;letter-spacing:-.01em;
  opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .6s var(--ease),background .25s}
.menu-open .menu li button{opacity:1;transform:none}
.menu li button:hover{background:#f5f4f1}
.menu li button em{font:400 10.5px/1 "Plex Mono",ui-monospace,monospace;font-style:normal;color:var(--grey);width:20px}
.menu li button small{margin-left:auto;font-size:11px;color:var(--grey);font-weight:400}
.menu li.on button{background:#f5f4f1}
.menu-foot{margin:0;padding:10px 16px 14px;font-size:11px;color:var(--grey);border-top:1px solid #f0efec}

/* ---------- intro UI (2D, aligned with the 3D floor line at 80 % of the viewport) ---------- */
.intro-ui{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .5s var(--ease)}
.is-entering .intro-ui{opacity:0}
.is-entering .intro-ui *{pointer-events:none!important}
.enter-wrap{position:absolute;left:50%;top:calc(80% - 44px - 26px);transform:translateX(-50%)}
.intro-p-wrap{position:absolute;left:50%;top:calc(80% + 20px);transform:translateX(-50%);width:max-content;max-width:92vw}
.rv{opacity:0;transform:translateY(24px);filter:blur(6px);transition:opacity 1s var(--ease),transform 1.1s var(--ease),filter 1s var(--ease)}
.is-loaded .rv{opacity:1;transform:none;filter:blur(0)}
.is-loaded .enter-wrap .rv{transition-delay:.85s}
.is-loaded .intro-p-wrap .rv{transition-delay:1s}
.enter{pointer-events:auto;height:44px;padding:0 24px;border:0;border-radius:999px;background:#111;color:#fff;font-size:14px;font-weight:500;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);transition:transform .5s var(--ease),background .3s}
.enter:hover{background:#000;transform:scale(1.035)}
.enter:active{transform:scale(.97)}
.enter:focus-visible{outline:2px solid #111;outline-offset:3px}
.roll{display:block;height:1.25em;overflow:hidden;line-height:1.25}
.roll span{display:block;transition:transform .55s var(--ease)}
.enter:hover .roll span{transform:translateY(-100%)}
.enter svg{transition:transform .55s var(--ease)}
.enter:hover svg{transform:translateX(3px)}
.intro-p{margin:0;text-align:center;font-size:13px;line-height:1.5;color:#5d5a54;letter-spacing:-.003em}

/* ---------- gallery HUD ---------- */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .9s var(--ease)}
.in-gallery .hud{opacity:1}
.in-gallery .hud .arrows{pointer-events:auto}
.caption{position:absolute;left:28px;bottom:50px;max-width:min(440px,62vw);will-change:opacity,transform}
.cap-idx{font:400 11px/1 "Plex Mono",ui-monospace,monospace;color:var(--grey);letter-spacing:.02em;margin-bottom:9px}
.cap-title{font-size:14px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.cap-meta{font-size:12px;line-height:1.4;color:var(--grey);margin-top:2px}
.progress{position:absolute;left:50%;bottom:34px;width:180px;margin-left:-90px;height:2px;border-radius:2px;background:rgba(17,17,17,.12);overflow:hidden}
.progress i{position:absolute;inset:0;background:#111;transform-origin:0 50%;transform:scaleX(0);display:block}
.ticks{position:absolute;left:50%;bottom:30px;width:180px;margin-left:-90px;height:10px}
.ticks b{position:absolute;bottom:0;width:1px;height:10px;background:rgba(17,17,17,.18);transform:translateX(-.5px)}
.arrows{position:absolute;right:24px;bottom:38px;display:flex;gap:8px}
.arrows button{width:40px;height:40px;border:0;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.05),0 8px 20px -8px rgba(0,0,0,.2);transition:transform .45s var(--ease),opacity .3s}
.arrows button:hover{transform:scale(1.07)}
.arrows button:active{transform:scale(.95)}
.arrows button:disabled{opacity:.35;cursor:default;transform:none}
.hint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:12px;color:#6f6c66;white-space:nowrap;transition:opacity .6s var(--ease)}
.hint-m{display:none}
.hint .mouse{width:14px;height:21px;border:1.3px solid #6f6c66;border-radius:8px;position:relative}
.hint .mouse::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:4px;margin-left:-1px;border-radius:1px;background:#6f6c66;animation:wheel 1.6s var(--ease) infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(6px);opacity:0}100%{transform:translateY(0);opacity:0}}

.studies{position:fixed;left:12px;bottom:12px;z-index:100;font:400 11px/1 "Plex Mono",ui-monospace,monospace;color:#fff;mix-blend-mode:difference;text-decoration:none;letter-spacing:.02em}

@media (max-width:760px){
  .caption{left:18px;bottom:76px;max-width:calc(100vw - 140px)}
  .arrows{right:16px;bottom:72px}
  .progress{left:18px;right:18px;width:auto;margin-left:0;bottom:44px}
  .ticks{display:none}
  .hint{bottom:auto;top:84px}
  .hint .mouse,.hint-d{display:none}
  .hint-m{display:inline}
  .intro-p{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  .rv,.nav{transition-duration:.01s!important;transition-delay:0s!important}
  .hint .mouse::after{animation:none}
}
</style>
</head>
<body>
<h1 class="sr">The room is open. Come in.</h1>

<div class="stage" id="stage" aria-hidden="true">
  <div class="world" id="world"></div>
  <div class="vignette"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-bar">
    <a class="logo" href="#" id="logo" aria-label="Open Room, back to the entrance"><i></i>Open Room</a>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
  </div>
  <nav class="menu" id="menu" aria-label="Works">
    <div class="menu-in">
      <ol id="menuList"></ol>
      <p class="menu-foot">Noa Lindqvist — six paintings, 2025–2026</p>
    </div>
  </nav>
</header>

<section class="intro-ui" id="introUi">
  <div class="enter-wrap"><div class="rv">
    <button class="enter" id="enterBtn">
      <span class="roll"><span>Enter the gallery</span><span aria-hidden="true">Enter the gallery</span></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1 7h11M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div></div>
  <div class="intro-p-wrap"><div class="rv">
    <p class="intro-p">A quiet white room for new paintings.<br>Walk in, take your time, look closer.</p>
  </div></div>
</section>

<section class="hud" id="hud" aria-live="polite">
  <div class="caption" id="caption">
    <div class="cap-idx" id="capIdx">00 / 06</div>
    <div class="cap-title" id="capTitle">Open Room</div>
    <div class="cap-meta" id="capMeta"></div>
  </div>
  <div class="hint" id="hint"><span class="mouse"></span><span class="hint-d">Scroll, swipe or use the arrow keys to walk</span><span class="hint-m">Swipe up to walk through the room</span></div>
  <div class="ticks" id="ticks"></div>
  <div class="progress"><i id="progFill"></i></div>
  <div class="arrows">
    <button id="prevBtn" aria-label="Previous work"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 7H2M6 3L2 7l4 4" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="nextBtn" aria-label="Next work"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h11M8 3l4 4-4 4" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>


<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const html = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) html.classList.add('reduce');

const stage = $('#stage'), world = $('#world');

/* =========================================================================
   WORLD UNITS — px. 4 px = 1 cm. Eye is at y = 0 (160 cm), y grows downward,
   the camera looks toward −z. Facade / doorway plane is z = 0, the room runs
   from z = 0 to z = −L, the lobby (intro) is z > 0.
   ========================================================================= */
const CM = 4;
const W = 2400;              // room width  (6 m)
const L = 8400;              // room length (21 m)
const FLOOR = 640;           // eye height 1.6 m
const CEIL = -760;           // ceiling at 3.5 m
const RH = FLOOR - CEIL;
const SEG = 4, SL = L / SEG; // big planes are split in segments
const OPEN = 1320;           // door slide distance
const DOOR_W = 3400, DOOR_TOP = -1800;
const BOX = { x: -560, w: 600, h: 880, d: 340, t: 24, base: 200, zf: -4900 };
BOX.zb = BOX.zf - BOX.d;
BOX.top = FLOOR - BOX.h;
BOX.nTop = BOX.top + BOX.t;          // niche ceiling
BOX.nBot = FLOOR - BOX.base;         // niche floor
BOX.nH = BOX.nBot - BOX.nTop;
const ROT = { floor: 'rotateX(90deg)', ceil: 'rotateX(-90deg)', left: 'rotateY(90deg)', right: 'rotateY(-90deg)', back: '', rear: 'rotateY(180deg)' };

const IMG = {
  C1: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_063948_e7a6463d-3b90-489c-84eb-c2f3ee73b846.png',
  C2: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_063948_52f9a2fb-804a-4513-be91-c4242a4fb440.png',
  C3: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_064024_02166100-f31d-45ac-a7b5-c7057e1833d8.png',
  C4: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_064024_0132b3fd-b60a-49f3-944f-7404e12607a1.png',
  C5: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_064034_ef748d85-9560-4396-ae7c-7005ebd5d98e.png',
  C6: 'https://d8j0ntlcm91z4.cloudfront.net/user_35qZl2awBJOL6cM0sHJHucU9S8O/hf_20261107_064119_41ece42f-382f-4f2b-86f6-c2d035f309ac.png'
};

/* fallback "paintings" (shown when the remote image can't load) */
const FB = {
  C1: 'radial-gradient(36% 28% at 32% 28%,#1d33a6 0 52%,transparent 74%),radial-gradient(30% 40% at 70% 62%,#e2412a 0 44%,transparent 72%),radial-gradient(44% 22% at 38% 80%,#2a48c9 0 40%,transparent 70%),linear-gradient(165deg,#f3eee6,#e6ddcf)',
  C2: 'radial-gradient(44% 22% at 38% 36%,#c98d2c 0 50%,transparent 76%),linear-gradient(118deg,transparent 46%,#191714 46.8% 53%,transparent 53.8%),radial-gradient(28% 18% at 72% 72%,#b9781d 0 45%,transparent 76%),#efe7d7',
  C3: 'linear-gradient(90deg,transparent 18%,rgba(255,255,255,.8) 18.6% 19.6%,transparent 20.2% 46%,rgba(255,255,255,.75) 46.5% 47.4%,transparent 48% 71%,rgba(255,255,255,.8) 71.5% 72.6%,transparent 73.2%) 0 0/100% 70% no-repeat,linear-gradient(180deg,#f39cc0,#f6b3cc 38%,#9ccdf0 62%,#b7dcf6)',
  C4: 'radial-gradient(70% 40% at 50% 80%,#f08163 0 50%,transparent 82%),linear-gradient(180deg,#1e4733 0 50%,#2a5a40 57%,#ee7c5f 64%,#f2967b)',
  C5: 'radial-gradient(11% 11% at 74% 28%,#e3432b 0 70%,transparent 74%),linear-gradient(128deg,transparent 26%,#151413 26.6% 35%,transparent 35.6%),linear-gradient(52deg,transparent 52%,#151413 52.6% 58%,transparent 58.6%),radial-gradient(17% 13% at 30% 72%,#151413 0 60%,transparent 64%),#f1eadf',
  C6: 'linear-gradient(#2b3fb3,#2b3fb3) 30% 12%/58% 30% no-repeat,linear-gradient(#cf2f78,#cf2f78) 70% 50%/56% 26% no-repeat,linear-gradient(#ee7a2c,#ee7a2c) 40% 88%/66% 24% no-repeat,linear-gradient(#e9a13b,#e9a13b) 62% 30%/26% 18% no-repeat,#efe7da'
};

const WORKS = [
  { key: 'C1', title: 'Blue Hour',            medium: 'Acrylic on canvas, 2026',             w: 120, h: 160, wall: 'left',  z: -1800, y: 36 },
  { key: 'C2', title: 'Ochre, Moving',        medium: 'Oil on linen, 2025',                  w: 160, h: 120, wall: 'right', z: -2850, y: 36 },
  { key: 'C3', title: 'Soft Weather',         medium: 'Acrylic and enamel on canvas, 2026',  w: 105, h: 140, wall: 'left',  z: -3850, y: 36 },
  { key: 'C4', title: 'Coral, Late',          medium: 'Oil on panel, 2026',                  w: 80,  h: 80,  wall: 'box',   y: 96 },
  { key: 'C5', title: 'A Red Word',           medium: 'Ink and oil on canvas, 2025',         w: 140, h: 105, wall: 'right', z: -6000, y: 36 },
  { key: 'C6', title: 'Evening Stack',        medium: 'Oil on canvas, 2026',                 w: 150, h: 200, wall: 'back',  y: 24 }
];
WORKS.forEach(w => { w.dims = `${w.w} × ${w.h} cm`; });

/* ---------- tiny DOM helpers ---------- */
function mk(cls, parent, inner) {
  const d = document.createElement('div');
  d.className = cls;
  if (inner) d.innerHTML = inner;
  (parent || world).appendChild(d);
  return d;
}
/* place a plane: centre at (x,y,z), world size w×h, orientation rot.
   res < 1 renders the element smaller and scales it up (less raster memory
   for big, soft surfaces). */
function put(d, w, h, x, y, z, rot, res) {
  res = res || 1;
  d.style.width = (w * res) + 'px';
  d.style.height = (h * res) + 'px';
  d.style.transform = `translate3d(${x}px,${y}px,${z}px) ${rot || ''} scale(${1 / res}) translate(-50%,-50%)`;
  return d;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

/* =========================================================================
   BUILD THE ROOM
   ========================================================================= */
/* segments overlap a few px at internal joints so no hairline seams show */
const segSpan = k => { const zN = -k * SL + (k > 0 ? 6 : 0), zF = -(k + 1) * SL - (k < SEG - 1 ? 6 : 4); return { zc: (zN + zF) / 2, len: zN - zF }; };

function buildRoom() {
  /* ---- gallery floor: pale tiles, light reflections, AO at the walls ---- */
  const FN = '#EEEBE5', FF = '#E1DED7';
  const refl = 'linear-gradient(90deg,rgba(255,255,255,0) 11%,rgba(255,255,255,.5) 20%,rgba(255,255,255,0) 29%,rgba(255,255,255,0) 41%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 59%,rgba(255,255,255,0) 71%,rgba(255,255,255,.5) 80%,rgba(255,255,255,0) 89%)';
  for (let k = 0; k < SEG; k++) {
    const sp = segSpan(k);
    const f = put(mk('pl'), W + 8, sp.len, 0, FLOOR, sp.zc, ROT.floor, 0.4);   /* +8: tuck under the walls */
    /* floor: element top = far end */
    /* tile grid (60 × 60 cm) anchored to world z so joints line up */
    const zTop = sp.zc - sp.len / 2, off = (((-zTop) % 240) + 240) % 240 * 0.4;
    f.style.background = [
      'linear-gradient(90deg,rgba(95,85,68,.09) 0 1px,transparent 1px)',
      'linear-gradient(180deg,rgba(95,85,68,.09) 0 1px,transparent 1px)',
      'linear-gradient(90deg,rgba(70,58,42,.14),rgba(70,58,42,0) 5%,rgba(70,58,42,0) 95%,rgba(70,58,42,.14))',
      refl,
      `linear-gradient(to bottom,${mixc(FN, FF, (k + 1) / SEG)},${mixc(FN, FF, k / SEG)})`
    ].join(',');
    f.style.backgroundSize = '96px 96px,96px 96px,100% 100%,100% 100%,100% 100%';
    f.style.backgroundPosition = `${4 * 0.4}px 0,0 ${off}px,0 0,0 0,0 0`;
  }

  /* ---- ceiling with glow around the light strips ---- */
  const CN = '#E9E8E4', CF = '#DCDAD5';
  const glow = 'linear-gradient(90deg,rgba(255,255,255,0) 7%,rgba(255,255,255,.8) 20%,rgba(255,255,255,0) 33%,rgba(255,255,255,0) 37%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 63%,rgba(255,255,255,0) 67%,rgba(255,255,255,.8) 80%,rgba(255,255,255,0) 93%)';
  for (let k = 0; k < SEG; k++) {
    const sp = segSpan(k);
    const c = put(mk('pl'), W + 8, sp.len, 0, CEIL, sp.zc, ROT.ceil, 0.25);
    /* ceiling: element top = near end */
    c.style.background = [
      'linear-gradient(90deg,rgba(60,50,38,.08),rgba(60,50,38,0) 6%,rgba(60,50,38,0) 94%,rgba(60,50,38,.08))',
      glow,
      `linear-gradient(to bottom,${mixc(CN, CF, k / SEG)},${mixc(CN, CF, (k + 1) / SEG)})`
    ].join(',');
  }
  /* ---- light strips: three bright bands running along the room ---- */
  const s0 = -160, s1 = -L + 160, sl = (s0 - s1) / SEG;
  [-720, 0, 720].forEach(x => {
    for (let k = 0; k < SEG; k++) {
      const zc = s0 - sl * (k + .5);
      const s = put(mk('pl'), 76, sl + (k < SEG - 1 ? 2 : 0), x, CEIL + 1, zc, ROT.ceil, 0.5);
      s.style.background = 'linear-gradient(90deg,#cdcac4 0 7%,#f4f3f0 12%,#fff 24% 76%,#f4f3f0 88%,#cdcac4 93% 100%)';
      s.style.boxShadow = '0 0 26px 8px rgba(255,255,255,.95)';
      if (k === 0) s.style.borderRadius = '19px 19px 0 0';
      if (k === SEG - 1) s.style.borderRadius = '0 0 19px 19px';
    }
  });

  /* ---- side walls: light from above, AO at floor, darker toward the far end ---- */
  const WN = '#F6F5F2', WF = '#E8E6E1';
  const wallV = [
    'linear-gradient(to top,rgba(40,34,26,.26) 0,rgba(40,34,26,.26) .45%,rgba(40,34,26,0) .45%)',                       // shadow gap
    'linear-gradient(to bottom,rgba(0,0,0,0) 3%,rgba(70,64,54,.12) 3%,rgba(70,64,54,.12) 3.3%,rgba(255,255,255,.75) 3.3%,rgba(255,255,255,.75) 3.6%,rgba(255,255,255,0) 3.6%)', // picture rail
    'linear-gradient(to bottom,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 28%,rgba(0,0,0,0) 60%,rgba(60,50,35,.05) 88%,rgba(60,50,35,.13) 100%)'
  ];
  [-1, 1].forEach(side => {
    for (let k = 0; k < SEG; k++) {
      const sp = segSpan(k);
      const wl = put(mk('pl'), sp.len, RH + 8, side * W / 2, (FLOOR + CEIL) / 2, sp.zc, side < 0 ? ROT.left : ROT.right, 0.25);
      const cNear = mixc(WN, WF, k / SEG), cFar = mixc(WN, WF, (k + 1) / SEG);
      /* left wall: element x → far ; right wall: element x → near */
      const along = side < 0 ? `linear-gradient(90deg,${cNear},${cFar})` : `linear-gradient(90deg,${cFar},${cNear})`;
      const corner = k === SEG - 1
        ? (side < 0 ? ',linear-gradient(90deg,rgba(60,50,38,0) 82%,rgba(60,50,38,.09))' : ',linear-gradient(90deg,rgba(60,50,38,.09),rgba(60,50,38,0) 18%)')
        : '';
      wl.style.background = wallV.join(',') + corner + ',' + along;
    }
  });

  /* ---- back wall ---- */
  const bw = put(mk('pl'), W + 8, RH + 8, 0, (FLOOR + CEIL) / 2, -L, ROT.back, 0.35);
  bw.style.background = [
    'linear-gradient(to top,rgba(40,34,26,.26) 0,rgba(40,34,26,.26) .45%,rgba(40,34,26,0) .45%)',
    'linear-gradient(to bottom,rgba(255,255,255,.6),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 62%,rgba(60,50,35,.06) 90%,rgba(60,50,35,.15))',
    'linear-gradient(90deg,rgba(60,50,38,.09),rgba(60,50,38,0) 10%,rgba(60,50,38,0) 90%,rgba(60,50,38,.09))',
    'radial-gradient(60% 55% at 50% 42%,rgba(255,255,255,.45),rgba(255,255,255,0) 72%)',
    '#E8E6E1'
  ].join(',');

  /* ---- lobby floor (intro): beige, soft contact shadow at the wall ---- */
  const lf = put(mk('pl'), 8400, 5600, 0, FLOOR, 2800, ROT.floor, 0.2);
  lf.style.background = [
    'linear-gradient(to bottom,rgba(70,58,40,.13) 0,rgba(70,58,40,.05) .55%,rgba(70,58,40,0) 2.4%)',
    'radial-gradient(42% 60% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)',
    'linear-gradient(to bottom,#E3DFD7,#E5E1D9 30%,#E2DED5)'
  ].join(',');
  /* threshold strip under the doors */
  const th = put(mk('pl'), W, 40, 0, FLOOR - .5, -20, ROT.floor, 1);
  th.style.background = 'linear-gradient(to bottom,#dcd8cf,#e6e3dc)';

  /* ---- static facade around the doorway (revealed when the doors slide) ---- */
  const facadeBg = 'linear-gradient(to bottom,#F6F6F4,#FBFBFA 60%)';
  const lt = put(mk('pl'), 9800, CEIL - DOOR_TOP, 0, (CEIL + DOOR_TOP) / 2, 0, '', 0.2);
  lt.style.background = 'linear-gradient(to top,rgba(60,50,38,.10),rgba(60,50,38,0) 6%),' + facadeBg;
  [-1, 1].forEach(s => {
    const sp = put(mk('pl'), 3700, RH, s * (W / 2 + 1850), (FLOOR + CEIL) / 2, 0, '', 0.2);
    sp.style.background = (s < 0
      ? 'linear-gradient(to left,rgba(60,50,38,.10),rgba(60,50,38,0) 1.2%),'
      : 'linear-gradient(to right,rgba(60,50,38,.10),rgba(60,50,38,0) 1.2%),') +
      'linear-gradient(to top,rgba(60,50,38,.05),rgba(60,50,38,0) 8%),#FAFAF9';
  });
}

/* ---------- the two sliding wall halves ---------- */
const doors = [];
function buildDoors() {
  [-1, 1].forEach(s => {
    const g = mk('grp');
    const panel = put(mk('pl', g), DOOR_W + 12, FLOOR - DOOR_TOP, s * (DOOR_W / 2 - 6), (FLOOR + DOOR_TOP) / 2, s < 0 ? .25 : 0, '', 0.25);
    panel.style.background = [
      'linear-gradient(to top,rgba(70,58,40,.07),rgba(70,58,40,0) 5%)',
      'radial-gradient(60% 70% at 50% 52%,rgba(255,255,255,.9),rgba(255,255,255,0) 75%)',
      'linear-gradient(to bottom,#F4F4F2,#FBFBFA 55%,#F8F8F6)'
    ].join(',');
    panel.style.backgroundSize = '100% 100%,200% 100%,100% 100%';
    panel.style.backgroundPosition = s < 0 ? '0 0,0 0,0 0' : '0 0,100% 0,0 0';
    /* seam: a thin darker line + soft falloff at the inner edge */
    const seam = put(mk('pl', g), 26, FLOOR - DOOR_TOP, s * 13, (FLOOR + DOOR_TOP) / 2, .5, '', 1);
    seam.style.background = s < 0
      ? 'linear-gradient(to left,rgba(40,36,30,.16) 0,rgba(40,36,30,.16) 2.2px,rgba(40,36,30,.035) 2.2px,rgba(40,36,30,0) 100%)'
      : 'linear-gradient(to right,rgba(40,36,30,.08) 0,rgba(40,36,30,.08) 1px,rgba(40,36,30,.03) 1px,rgba(40,36,30,0) 100%)';
    doors.push({ g, s, text: null });
  });
}

/* headline halves (rebuilt on resize — size depends on the intro framing) */
const HEAD_HTML = '<p class="wall-head"><span>The room is open.</span><span>Come in.</span></p>';
function layoutHeadline() {
  const S = vw < 760 ? Math.min(42, vw * 0.083) : Math.min(76, Math.max(40, vw * 0.049)); // on-screen px
  const fw = S * dIntro / P;                         // world font-size
  const res = Math.min(1, 1.3 * P / dIntro);         // raster ≈ 1.3× screen
  const yHead = -0.1 * vh * dIntro / P;              // headline centre at 40 % of the viewport
  const half = Math.max(900, fw * 6.2), hh = fw * 2.6;
  doors.forEach(d => {
    if (!d.text) {
      d.text = mk('pl wall-text', d.g, `<div class="wall-text-in">${HEAD_HTML}</div>`);
      d.inner = d.text.firstChild;
    }
    put(d.text, half, hh, d.s * half / 2, yHead, 1, '', res);
    d.inner.style.width = (2 * half * res) + 'px';
    d.inner.style.left = d.s < 0 ? '0px' : (-half * res) + 'px';
    d.inner.firstChild.style.fontSize = (fw * res) + 'px';
  });
}
let lastDoor = -1;
function setDoors(e) {
  if (e === lastDoor) return;
  lastDoor = e;
  doors.forEach(d => { d.g.style.transform = `translate3d(${d.s * OPEN * e}px,0,4px)`; });
}

/* ---------- artworks ---------- */
function buildWorks() {
  WORKS.forEach((wk, i) => {
    const pw = wk.w * CM, ph = wk.h * CM, B = 10, ow = pw + 2 * B, oh = ph + 2 * B, DEPTH = 16;
    let x, z, rot, top = CEIL, wx, wz;
    if (wk.wall === 'left')       { x = -W / 2 + 1 + DEPTH; z = wk.z; rot = ROT.left;  wx = -W / 2 + 1; wz = z; }
    else if (wk.wall === 'right') { x =  W / 2 - 1 - DEPTH; z = wk.z; rot = ROT.right; wx =  W / 2 - 1; wz = z; }
    else if (wk.wall === 'back')  { x = 0; z = -L + 1 + DEPTH; rot = ''; wx = 0; wz = -L + 1; }
    else { x = BOX.x; z = BOX.zb + BOX.t + 1 + DEPTH; rot = ''; top = BOX.nTop; wx = x; wz = BOX.zb + BOX.t + 1; }
    wk.at = { x, z };

    /* soft shadow cast on the wall */
    const sh = put(mk('pl wshadow', null, '<i></i>'), ow + 220, oh + 220, wx, wk.y, wz, rot, 0.5);   /* soft → half-res raster */
    sh.dataset.k = wk.key;

    /* the framed painting with its hanging wires (and a wall label) */
    const el = put(mk('pl work'), ow, oh, x, wk.y, z, rot, 1);
    const wireH = Math.max(0, (wk.y - oh / 2) - top);
    const lbl = wk.wall === 'box' ? '' :
      `<div class="label" style="left:calc(100% + ${Math.round(70 + pw * .04)}px)"><b>${wk.title}</b>Noa Lindqvist<br>${wk.medium}<br>${wk.dims}</div>`;
    el.innerHTML =
      `<i class="wire" style="left:13%;height:${wireH}px"></i><i class="wire" style="left:87%;height:${wireH}px"></i>` +
      `<div class="frame" style="border-width:${B}px;background:${FB[wk.key]}"><img src="${IMG[wk.key]}" alt="" loading="eager" decoding="async" onerror="this.style.visibility='hidden'"></div>` + lbl;

    /* frame edge (depth) facing the entrance, for side walls */
    if (wk.wall === 'left' || wk.wall === 'right') {
      const ex = wk.wall === 'left' ? -W / 2 + 1 + DEPTH / 2 : W / 2 - 1 - DEPTH / 2;
      const edge = put(mk('pl'), DEPTH, oh, ex, wk.y, wk.z + ow / 2, '', 1);
      edge.style.background = 'linear-gradient(90deg,#2b2926,#3b3834)';
    }
    /* soft shadow on the floor under the work */
    if (wk.wall !== 'box') {
      let fs;
      if (wk.wall === 'left') {
        fs = put(mk('pl'), 300, ow * 1.6, -W / 2 + 150, FLOOR - 1, wk.z, ROT.floor, 0.25);
        fs.style.background = 'radial-gradient(100% 48% at 0% 50%,rgba(52,42,28,.15),rgba(52,42,28,0) 72%)';
      } else if (wk.wall === 'right') {
        fs = put(mk('pl'), 300, ow * 1.6, W / 2 - 150, FLOOR - 1, wk.z, ROT.floor, 0.25);
        fs.style.background = 'radial-gradient(100% 48% at 100% 50%,rgba(52,42,28,.15),rgba(52,42,28,0) 72%)';
      } else {
        fs = put(mk('pl'), ow * 1.6, 300, 0, FLOOR - 1, -L + 150, ROT.floor, 0.25);
        fs.style.background = 'radial-gradient(48% 100% at 50% 0%,rgba(52,42,28,.15),rgba(52,42,28,0) 72%)';
      }
    }
  });
}

/* ---------- free-standing display box (a white niche holding one work) ---------- */
function buildBox() {
  const { x, w, h, d, t, base, zf, zb, top, nTop, nBot, nH } = BOX;
  const yMid = (top + FLOOR) / 2, zMid = (zf + zb) / 2, ziMid = (zf + zb + t) / 2, iw = w - 2 * t, id = d - t;
  const P_ = (cls, ww, hh, px, py, pz, rot, bg) => { const e = put(mk('pl'), ww, hh, px, py, pz, rot, 0.4); e.style.background = bg; return e; };
  const AO = 'linear-gradient(to top,rgba(40,34,26,.22) 0,rgba(40,34,26,0) 4%)';
  /* outside */
  P_('', d, h, x - w / 2, yMid, zMid, 'rotateY(-90deg)', AO + ',linear-gradient(to bottom,#F1F0EC,#E8E6E1)');
  P_('', d, h, x + w / 2, yMid, zMid, ROT.left, AO + ',linear-gradient(to bottom,#F7F6F3,#EEEDE9)');
  P_('', w, h, x, yMid, zb, ROT.rear, AO + ',linear-gradient(to bottom,#F1F0EC,#E6E4DF)');
  /* front face: edges + base */
  P_('', t, h, x - w / 2 + t / 2, yMid, zf, '', AO + ',#FAFAF8');
  P_('', t, h, x + w / 2 - t / 2, yMid, zf, '', AO + ',#FAFAF8');
  P_('', iw, t, x, top + t / 2, zf, '', '#FBFBF9');
  P_('', iw, base, x, FLOOR - base / 2, zf, '', 'linear-gradient(to top,rgba(40,34,26,.2) 0,rgba(40,34,26,0) 14%),linear-gradient(to bottom,rgba(0,0,0,.06),rgba(0,0,0,0) 8%),#F7F6F3');
  /* inside */
  P_('', id, nH, x - w / 2 + t, (nTop + nBot) / 2, ziMid, ROT.left, 'linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,0) 20%),linear-gradient(90deg,#F0EFEB,#DEDCD6)');
  P_('', id, nH, x + w / 2 - t, (nTop + nBot) / 2, ziMid, ROT.right, 'linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,0) 20%),linear-gradient(90deg,#DEDCD6,#F0EFEB)');
  P_('', iw, id, x, nTop, ziMid, ROT.ceil, 'linear-gradient(to bottom,#fff 0,#fff 5%,rgba(255,255,255,.6) 8%,rgba(255,255,255,0) 30%),linear-gradient(to bottom,#E6E4DF,#D9D7D1)');
  P_('', iw, id, x, nBot, ziMid, ROT.floor, 'linear-gradient(to bottom,rgba(40,34,26,.10),rgba(40,34,26,0) 40%),#ECEAE5');
  P_('', iw, nH, x, (nTop + nBot) / 2, zb + t, '', 'radial-gradient(60% 50% at 50% 42%,rgba(255,255,255,.75),rgba(255,255,255,0) 75%),linear-gradient(to bottom,#E3E1DC,#ECEAE5 40%,#E2E0DA)');
  /* floor shadow around the box */
  const fs = put(mk('pl'), w + 420, d + 420, x, FLOOR - 1, zMid, ROT.floor, 0.25);
  fs.style.background = 'radial-gradient(50% 50% at 50% 50%,rgba(52,42,28,.16),rgba(52,42,28,.06) 50%,rgba(52,42,28,0) 72%)';
}

/* =========================================================================
   CAMERA
   ========================================================================= */
let vw = 0, vh = 0, P = 1300, dIntro = 3000, introPose, stops = [];
const N = WORKS.length + 1;               // stop 0 = room overview

function buildStops() {
  const narrow = vw < 760;
  const fillW = narrow ? 0.8 : 0.6;
  const s = [{ x: 0, y: 0, z: -260, h: 0, p: 1.4 }];
  WORKS.forEach(wk => {
    const ow = wk.w * CM + 20, oh = wk.h * CM + 20;
    const fillH = wk.wall === 'box' ? 0.42 : wk.wall === 'back' ? 0.6 : 0.64;
    let D = Math.max(P * oh / (fillH * vh), P * ow / (fillW * vw));
    let st;
    if (wk.wall === 'left')       { D = Math.min(D, W - 280); st = { x: -W / 2 + 17 + D, z: wk.z, h: 90 }; }
    else if (wk.wall === 'right') { D = Math.min(D, W - 280); st = { x:  W / 2 - 17 - D, z: wk.z, h: -90 }; }
    else if (wk.wall === 'back')  { D = Math.min(D, 3200);    st = { x: 0, z: wk.at.z + D, h: 0 }; }
    else { D = Math.min(Math.max(D, BOX.d + 260), 2000);     st = { x: BOX.x, z: wk.at.z + D, h: 0 }; }
    /* straight on: eye drops to the work's centre (≤ 24 cm), no pitch → no keystone */
    st.y = wk.y; st.p = 0;
    s.push(st);
  });
  /* walk around the display box on the way to the next work */
  const iBox = WORKS.findIndex(w => w.wall === 'box') + 1;
  if (s[iBox + 1]) s[iBox + 1].via = { x: BOX.x + BOX.w / 2 + 430, z: BOX.zf + 40 };
  stops = s;
}

function layout() {
  vw = innerWidth; vh = innerHeight;
  P = Math.round(Math.min(1900, Math.max(700, Math.max(vw, vh) * 0.9)));
  stage.style.perspective = P + 'px';
  dIntro = FLOOR * P / (0.3 * vh);             // floor line at 80 % of the viewport
  introPose = { x: 0, y: 0, z: dIntro, h: 0, p: 0 };
  buildStops();
  layoutHeadline();
}

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // in-out cubic
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const mixPose = (A, B, t) => ({ x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t, z: A.z + (B.z - A.z) * t, h: A.h + (B.h - A.h) * t, p: A.p + (B.p - A.p) * t });

function pathPose(q) {
  const n = stops.length - 1;
  q = clamp(q, 0, n);
  const i = Math.min(Math.floor(q), n - 1), u = q - i;
  const A = stops[i], B = stops[i + 1];
  const e = 0.5 - 0.5 * Math.cos(Math.PI * u);
  let x, z;
  if (B.via) {
    const a = (1 - e) * (1 - e), b = 2 * e * (1 - e), c = e * e;
    x = a * A.x + b * B.via.x + c * B.x;
    z = a * A.z + b * B.via.z + c * B.z;
  } else {
    x = A.x + (B.x - A.x) * e;
    z = A.z + (B.z - A.z) * e;
  }
  const h = A.h + (B.h - A.h) * e;
  const p = A.p + (B.p - A.p) * e + Math.sin(Math.PI * u) * 1.6;   // glance up the room while walking
  const y = A.y + (B.y - A.y) * e - Math.sin(Math.PI * u) * 14;     // stand tall while walking
  return { x, y, z, h, p };
}

let lastCam = '';
function applyCamera(c) {
  const s = `translateZ(${P}px) rotateX(${c.p.toFixed(4)}deg) rotateY(${(-c.h).toFixed(4)}deg) translate3d(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px,${(-c.z).toFixed(2)}px)`;
  if (s !== lastCam) { world.style.transform = s; lastCam = s; }
}

/* =========================================================================
   STATE + INPUT
   ========================================================================= */
let state = 'intro';      // intro | entering | gallery | exiting
let p = 0, pt = 0;        // smoothed / target progress (in stops)
let tl = 0, exitFrom = null, pendingStop = 0, lockUntil = 0, interacted = false;
const look = { h: 0, p: 0 }, lookT = { h: 0, p: 0 };
const ENTER_DUR = 2.4;
let loadedAt = Infinity;

function enter(target) {
  if (state !== 'intro') return;
  pendingStop = target || 0;
  closeMenu();
  html.classList.add('is-entering');
  if (reduce) {
    state = 'gallery'; p = pt = pendingStop; setDoors(1);
    html.classList.add('in-gallery');
    fadeStage();
    return;
  }
  state = 'entering'; tl = 0;
}
function finishEnter() {
  state = 'gallery'; p = pt = 0; lockUntil = performance.now() + 350;
  if (pendingStop) goTo(pendingStop);
}
function exitGallery() {
  if (state !== 'gallery') return;
  closeMenu();
  html.classList.remove('in-gallery');
  if (reduce) {
    state = 'intro'; p = pt = 0; setDoors(0);
    html.classList.remove('is-entering');
    fadeStage();
    return;
  }
  glide = null; exitFrom = pathPose(p); state = 'exiting'; tl = ENTER_DUR;
}
function finishExit() {
  state = 'intro'; p = pt = 0;
  html.classList.remove('is-entering');
}
function fadeStage() {
  stage.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, easing: 'ease-out' });
}

/* discrete moves (arrows, keys, menu) glide with an in-out ease; wheel/touch use the lerp */
let glide = null;
function goTo(i) {
  i = clamp(Math.round(i), 0, N - 1);
  if (state === 'intro') { enter(i); return; }
  if (state !== 'gallery') return;
  markInteracted();
  if (reduce) { if (i !== pt) fadeStage(); p = pt = i; glide = null; return; }
  if (i === (glide ? glide.to : pt)) return;
  glide = { from: p, to: i, t: 0, dur: Math.min(2.6, 1.15 + 0.32 * Math.abs(i - p)) };
}
function step(dir) { goTo((glide ? glide.to : Math.round(pt)) + dir); }
function markInteracted() { if (!interacted) { interacted = true; } }

/* wheel / trackpad: virtual progress, then snap to a stop when the gesture ends */
const WHEEL_K = 1 / 520;
let snapTimer = 0, lastDir = 0, reduceAcc = 0, reduceLock = 0;
function snap() {
  const base = Math.floor(pt + 1e-6), f = pt - base;
  let target;
  if (lastDir > 0) target = f > 0.12 ? base + 1 : base;
  else if (lastDir < 0) target = f < 0.88 ? base : base + 1;
  else target = Math.round(pt);
  pt = clamp(target, 0, N - 1);
}
function addDelta(d) {
  if (state === 'intro') {
    if (d > 4 && performance.now() > loadedAt + 500) enter(0);
    return;
  }
  if (state !== 'gallery' || performance.now() < lockUntil) return;
  if (reduce) {               // discrete steps, no continuous camera motion
    reduceAcc += d;
    if (Math.abs(reduceAcc) > 60 && performance.now() > reduceLock) {
      step(Math.sign(reduceAcc)); reduceAcc = 0; reduceLock = performance.now() + 650;
    }
    return;
  }
  d = clamp(d, -140, 140);
  if (glide) { pt = p; glide = null; }
  pt = clamp(pt + d * WHEEL_K, 0, N - 1);
  lastDir = Math.sign(d);
  markInteracted();
  clearTimeout(snapTimer);
  snapTimer = setTimeout(snap, 180);
}
addEventListener('wheel', e => {
  if (e.ctrlKey) return;                         // let pinch-zoom through
  if (e.target.closest && e.target.closest('.menu')) return;
  e.preventDefault();
  let d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= vh;
  addDelta(d);
}, { passive: false });

/* touch */
let tY = 0, tX = 0, tStartY = 0, touching = false;
addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('button,a,.menu')) return;
  const t = e.touches[0]; tY = tStartY = t.clientY; tX = t.clientX; touching = true;
}, { passive: true });
addEventListener('touchmove', e => {
  if (!touching) return;
  e.preventDefault();
  const t = e.touches[0];
  const dy = tY - t.clientY, dx = tX - t.clientX;
  tY = t.clientY; tX = t.clientX;
  if (state === 'intro') { if (tStartY - t.clientY > 50) { touching = false; enter(0); } return; }
  addDelta((Math.abs(dy) >= Math.abs(dx) ? dy : dx) * 2.2);
}, { passive: false });
addEventListener('touchend', () => { touching = false; });

/* keyboard */
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); return; }
  if (e.target.closest && e.target.closest('.menu') && (e.key === 'Enter' || e.key === ' ')) return;
  const fwd = ['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key);
  const back = ['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key);
  if (state === 'intro') {
    if ((fwd && e.key !== ' ') || (e.key === 'Enter' && document.activeElement === document.body)) { e.preventDefault(); enter(0); }
    return;
  }
  if (state !== 'gallery') return;
  if (fwd) { e.preventDefault(); if (e.target.tagName !== 'BUTTON' || e.key !== ' ') step(1); }
  else if (back) { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(N - 1);
});

/* mouse look-around */
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || reduce) return;
  const nx = (e.clientX / vw) * 2 - 1, ny = (e.clientY / vh) * 2 - 1;
  lookT.h = -nx * 3; lookT.p = -ny * 2;
});
document.addEventListener('pointerleave', () => { lookT.h = 0; lookT.p = 0; });
addEventListener('blur', () => { lookT.h = 0; lookT.p = 0; });

/* buttons */
$('#enterBtn').addEventListener('click', () => enter(0));
$('#prevBtn').addEventListener('click', () => step(-1));
$('#nextBtn').addEventListener('click', () => step(1));
$('#logo').addEventListener('click', e => { e.preventDefault(); if (state === 'gallery') exitGallery(); else closeMenu(); });

/* menu (hamburger) — lists the works, click to walk to one */
const menuList = $('#menuList'), burger = $('#burger');
const menuItems = [{ title: 'The room', meta: 'Overview' }].concat(WORKS.map(w => ({ title: w.title, meta: w.dims })));
menuList.innerHTML = menuItems.map((m, i) =>
  `<li><button data-i="${i}" style="transition-delay:${(i * 0.035 + 0.08).toFixed(3)}s"><em>${String(i).padStart(2, '0')}</em>${m.title}<small>${m.meta}</small></button></li>`).join('');
menuList.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { goTo(+b.dataset.i); closeMenu(); } });
function closeMenu() { html.classList.remove('menu-open'); burger.setAttribute('aria-expanded', 'false'); burger.setAttribute('aria-label', 'Open menu'); }
burger.addEventListener('click', () => {
  const open = !html.classList.contains('menu-open');
  html.classList.toggle('menu-open', open);
  burger.setAttribute('aria-expanded', String(open));
  burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
});

/* =========================================================================
   HUD
   ========================================================================= */
const caption = $('#caption'), capIdx = $('#capIdx'), capTitle = $('#capTitle'), capMeta = $('#capMeta');
const progFill = $('#progFill'), hint = $('#hint'), prevBtn = $('#prevBtn'), nextBtn = $('#nextBtn');
$('#ticks').innerHTML = Array.from({ length: N }, (_, i) => `<b style="left:${(i / (N - 1) * 100).toFixed(3)}%"></b>`).join('');
let capShown = -1;
function setCaption(i) {
  capShown = i;
  const tot = String(WORKS.length).padStart(2, '0');
  capIdx.textContent = `${String(i).padStart(2, '0')} / ${tot}`;
  if (i === 0) { capTitle.textContent = 'Open Room — Noa Lindqvist'; capMeta.textContent = 'Six new paintings · 7 Nov 2026 – 31 Jan 2027'; }
  else { const w = WORKS[i - 1]; capTitle.textContent = w.title; capMeta.textContent = `${w.medium}, ${w.dims}`; }
  [...menuList.children].forEach((li, k) => li.classList.toggle('on', k === i));
}
setCaption(0);
let lastHud = '';
function updateHud() {
  const ni = Math.round(p), dist = Math.abs(p - ni);
  const o = 1 - smooth(0.1, 0.32, dist);
  if (ni !== capShown && o < 0.02) setCaption(ni);
  const op = capShown === ni ? o : 0;
  const key = op.toFixed(3) + '|' + p.toFixed(4) + '|' + interacted + '|' + (glide ? glide.to : pt);
  if (key === lastHud) return;
  lastHud = key;
  caption.style.opacity = op.toFixed(3);
  caption.style.transform = `translateY(${((1 - op) * 8).toFixed(2)}px)`;
  progFill.style.transform = `scaleX(${(p / (N - 1)).toFixed(4)})`;
  hint.style.opacity = (!interacted && p < 0.2) ? 1 : 0;
  const tgt = glide ? glide.to : pt;
  prevBtn.disabled = tgt <= 0;
  nextBtn.disabled = tgt >= N - 1;
}

/* =========================================================================
   LOOP
   ========================================================================= */
const introUi = $('#introUi');
let lastT = performance.now(), lastIntroUi = '';
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  const k = 1 - Math.pow(1 - 0.08, dt * 60);
  if (glide) {
    glide.t += dt;
    const u = clamp(glide.t / glide.dur);
    p = pt = glide.from + (glide.to - glide.from) * ease(u);
    if (u >= 1) glide = null;
  } else if (reduce) p = pt;
  else { p += (pt - p) * k; if (Math.abs(pt - p) < 3e-4) p = pt; }
  const kl = 1 - Math.pow(1 - 0.06, dt * 60);
  look.h += (lookT.h - look.h) * kl;
  look.p += (lookT.p - look.p) * kl;

  let pose, amp;
  if (state === 'intro') { pose = introPose; amp = 0.3; setDoors(0); }
  else if (state === 'gallery') { pose = pathPose(p); amp = 1; setDoors(1); }
  else {
    tl += state === 'entering' ? dt : -dt;
    const T = clamp(tl, 0, ENTER_DUR);
    setDoors(ease(clamp((T - 0.05) / 1.55)));
    const ce = ease(clamp((T - 0.12) / 2.2));
    pose = mixPose(introPose, state === 'entering' ? pathPose(0) : exitFrom, ce);
    amp = 0.3 + 0.7 * ce;
    if (state === 'entering' && T > 1.85) html.classList.add('in-gallery');
    if (state === 'entering' && tl >= ENTER_DUR) finishEnter();
    else if (state === 'exiting' && tl <= 0) finishExit();
  }
  applyCamera({ x: pose.x, y: pose.y, z: pose.z, h: pose.h + look.h * amp, p: pose.p + look.p * amp });

  /* keep the 2D intro button glued to the 3D floor line while looking around */
  if (state === 'intro') {
    const dx = P * Math.tan(look.h * amp * Math.PI / 180), dy = P * Math.tan(look.p * amp * Math.PI / 180);
    const s = `translate3d(${dx.toFixed(2)}px,${dy.toFixed(2)}px,0)`;
    if (s !== lastIntroUi) { introUi.style.transform = s; lastIntroUi = s; }
  }
  updateHud();
  requestAnimationFrame(frame);
}

/* =========================================================================
   BOOT
   ========================================================================= */
vw = innerWidth; vh = innerHeight;
buildRoom();
buildBox();
buildWorks();
buildDoors();
layout();
applyCamera(introPose);
let rz = 0;
addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
requestAnimationFrame(frame);

let booted = false;
const boot = () => {
  if (booted) return; booted = true;
  requestAnimationFrame(() => requestAnimationFrame(() => { html.classList.add('is-loaded'); loadedAt = performance.now(); }));
};
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
setTimeout(boot, 1200);

/* small debug hook for automated checks */
window.__gallery = { get state() { return state; }, get p() { return p; }, get pt() { return pt; }, goTo, stops: () => stops,
  jump(q) { if (state === 'gallery') { glide = null; p = pt = clamp(q, 0, N - 1); } } };
})();
</script>

<style>

.sz-bar{position:fixed;top:0;left:0;right:0;height:28px;z-index:2147483646;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0E0E0E;color:#EDEAE3;border-bottom:1px solid #2A2A28;font:500 13px/1 "SZ Tight","Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;mix-blend-mode:normal;pointer-events:auto}
.sz-bar a{color:#8A8A85;text-decoration:none;font:400 11px/1 "SZ Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.sz-bar a:hover,.sz-bar a:focus-visible{color:#EDEAE3}

</style>
<div class="sz-bar" role="banner"><span>Switzer Int.</span></div>
<script>
(function(){
  var H = 28;
  function shift(){
    document.querySelectorAll('body *').forEach(function(el){
      if (el.closest('.sz-bar') || el.dataset.szShifted) return;
      var cs = getComputedStyle(el);
      if (cs.position !== 'fixed') return;
      var r = el.getBoundingClientRect();
      if (r.height > 0 && r.height < 220 && r.top < H) {
        var t = parseFloat(cs.top); if (isNaN(t)) t = 0;
        el.style.top = (t + H) + 'px';
        el.dataset.szShifted = '1';
      }
    });
  }
  if (document.readyState === 'complete') shift(); else window.addEventListener('load', shift);
  setTimeout(shift, 1500); setTimeout(shift, 4000);
})();
</script>
